{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="login-box card">
    <h1>Đăng nhập</h1>
    <p>Hệ thống điểm danh sinh viên bằng nhận diện khuôn mặt.</p>
    <form method="post">
        <div class="form-row">
            <label>Tài khoản</label>
            <input name="username" placeholder="admin" required>
        </div>
        <div class="form-row">
            <label>Mật khẩu</label>
            <input name="password" type="password" placeholder="admin123" required>
        </div>
        <button type="submit">Đăng nhập</button>
    </form>
    <hr>
    <p><strong>Tài khoản demo:</strong></p>
    <p>Admin: <code>admin / admin123</code></p>
    <p>Giáo viên: <code>teacher / teacher123</code></p>
    <p>Sinh viên: <code>B23DCCN455 / student123</code></p>
</div>
{% endblock %}
